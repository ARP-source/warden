[project]
name = "warden"
version = "0.1.0"
description = "Agent Permission Immune System - autonomous red-team/patch loop for agent tool-call permission boundaries"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
obs = ["weave>=0.51"]
dash = ["marimo>=0.9", "altair>=5.4", "pandas>=2.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
warden = "warden.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden", "target", "attacker", "defender", "analysis", "evals", "orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
